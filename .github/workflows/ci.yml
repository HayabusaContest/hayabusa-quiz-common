name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hayabusa-quiz-common
      # 横並び clone を再現できると server/agent との一致も検査する(無ければ skip)。
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: HayabusaContest/hayabusa-quiz-server
          path: hayabusa-quiz-server
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: HayabusaContest/hayabusa-quiz-agent
          path: hayabusa-quiz-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: protocol.json is valid JSON
        run: python -c "import json; json.load(open('hayabusa-quiz-common/protocol/protocol.json'))"
      - name: protocol sync test
        working-directory: hayabusa-quiz-common
        run: python -m unittest discover -s tests -v
